services:
  flowbun:
    build: .
    image: flowbun:demo
    container_name: flowbun-demo
    ports:
      - "4200:4200"
      - "8787:8787"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Live: battery_controller (and any other @hass/action node) sends
      # real service calls to Home Assistant instead of just logging them.
      # See packages/runtime/src/hass/client.ts's isDryRun().
      FLOWBUN_DRY_RUN: "false"
