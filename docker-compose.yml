services:
  flowbun:
    build: .
    image: flowbun:demo
    container_name: flowbun-demo
    ports:
      - "4200:4200"
      - "8787:8787"
      # voice-assist package's @http/in endpoint — Home Assistant's
      # flowbun_conversation integration POSTs here
      - "8130:8130"
    volumes:
      - ./data:/app/data
      # Sibling checkout of flowbun-registry, mounted read-only so the
      # coordinator's flowbun-package installer (FLOWBUN_REGISTRY_URL below)
      # can browse/install from it before it's pushed to GitHub.
      - ../flowbun-registry:/app/registry:ro
    env_file:
      - .env
    environment:
      # Live vs just logged HASS calls
      FLOWBUN_DRY_RUN: "false"
      FLOWBUN_REGISTRY_URL: /app/registry
      # Household-local time for anything that formats a Date — most
      # visibly voice_gate's "Current date and time" prompt line, which
      # the voice assistant reads times back from.
      TZ: Europe/London
